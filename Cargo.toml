[package]
name = "llm-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Unified intermediate representation and bidirectional conversion for LLM chat APIs, with a pluggable HTTP transport"
readme = "README.md"

[features]
default = ["reqwest"]
reqwest = ["dep:reqwest"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
http = "1"
bytes = "1"
futures-core = "0.3"
time = { version = "0.3", default-features = false, features = ["std", "parsing"] }
reqwest = { version = "0.13", optional = true, features = ["stream"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
futures-util = "0.3"
wiremock = "0.6"

[lints.rust]
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs_dep)'] }
#unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[lints.clippy]
#alloc_instead_of_core = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
doc_markdown = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
#needless_lifetimes = "allow"
nonstandard_macro_braces = "warn"
print_stderr = "warn"
print_stdout = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
ref_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
#std_instead_of_core = "allow"
#std_instead_of_alloc = "warn"
#too_long_first_doc_paragraph = "allow"
#too_many_arguments = "allow"
#type_complexity = "allow"
undocumented_unsafe_blocks = "warn"
unwrap_or_default = "warn"
