# Downstream compile check for the README installation section: the
# `[dependencies]` below must mirror the documented list verbatim
# (versions and features), with `llm-api` swapped to a path dependency.
# `tests/downstream_readme.rs` drives `cargo check` over this crate.

[package]
name = "downstream-readme"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
# README: llm-api = "0.1"  (includes the reqwest-based default transport)
llm-api = { path = "../../.." }
reqwest = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
futures-util = "0.3"

# Detached from any parent workspace.
[workspace]
